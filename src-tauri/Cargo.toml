[package]
name = "github_build_notifier"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.4", default-features = false, features = ["wry", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2.5.4"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.2"
winreg = "0.55.0"
